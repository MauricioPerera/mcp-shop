name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  cloudflare:
    name: mcp-shop (Cloudflare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-shop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-shop/package-lock.json

      - name: Create .dev.vars for tests
        run: |
          cat > .dev.vars <<'EOF'
          AUTH_TOKEN=ci-test-auth-token
          ADMIN_AUTH_TOKEN=ci-test-admin-token
          WEBHOOK_SECRET=ci-test-webhook-secret
          PUBLIC_URL=http://127.0.0.1:8787
          EOF

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  vps:
    name: mcp-shop-vps (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-shop-vps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-shop-vps/package-lock.json

      - run: npm ci
      - run: npm test
