name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  cloudflare:
    name: mcp-shop (Cloudflare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-shop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-shop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  vps:
    name: mcp-shop-vps (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-shop-vps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-shop-vps/package-lock.json

      - run: npm ci
      - run: npm test
